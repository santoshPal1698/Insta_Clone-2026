{% extends 'base.html' %}
{% block title %}Password reset complete | SP-TECH{% endblock title %}
{% block content %}
<main class="account-page">
    <section class="account-card" aria-labelledby="account-heading">
        <header class="account-card-heading">
            <span class="account-card-icon"><i class="fas fa-check" aria-hidden="true"></i></span>
            <h1 id="account-heading">Password reset complete</h1>
            <p>Your password has been updated. You can now sign in with your new password.</p>
        </header>
        <a href="{% url 'login' %}" class="btn account-submit">Log in</a>
    </section>
</main>
{% endblock %}
