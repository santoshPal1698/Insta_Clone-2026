{% extends 'base.html' %}
{% block title %}Password changed | SP-INSTA{% endblock title %}
{% block content %}
<main class="account-page">
    <section class="account-card" aria-labelledby="account-heading">
        <header class="account-card-heading">
            <span class="account-card-icon"><i class="fas fa-check" aria-hidden="true"></i></span>
            <h1 id="account-heading">Password changed</h1>

        <a href="{% url 'home' %}" class="btn account-submit">Continue to home</a>

</main>
{% endblock %}
