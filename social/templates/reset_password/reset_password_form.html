{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Choose a new password | SP-TECH{% endblock title %}
{% block content %}
<main class="account-page">
    <section class="account-card" aria-labelledby="account-heading">
        <header class="account-card-heading">
            <span class="account-card-icon"><i class="fas fa-lock" aria-hidden="true"></i></span>
            <h1 id="account-heading">Choose a new password</h1>
            <p>Enter your new password twice to confirm it was typed correctly.</p>
        </header>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="account-submit">Update password</button>
        </form>
    </section>
</main>
{% endblock %}
