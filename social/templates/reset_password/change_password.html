{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Change password | SP-TECH{% endblock title %}
{% block content %}
<main class="account-page">
    <section class="account-card" aria-labelledby="account-heading">
        <header class="account-card-heading">
            <span class="account-card-icon"><i class="fas fa-key" aria-hidden="true"></i></span>
            <h1 id="account-heading">Change your password</h1>
            <p>Choose a strong password to keep your account secure.</p>
        </header>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="account-submit">Save new password</button>
        </form>
        <a class="account-link" href="{% url 'home' %}">Back to home</a>
    </section>
</main>
{% endblock %}
