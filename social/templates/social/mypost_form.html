{% extends 'base.html' %}
{% block title %} Create post page  {% endblock title %}  

{% block content %}
{% load crispy_forms_tags %}
{% load static %}


<section class="container-fluid">
<main class="container social-form-card card">
<div class="row">
	<div class="col-md-12">
	<h1>Create a post</h1>
	<p class="text-muted">Share a photo, video, or moment with your community.</p>
		<hr>
		<form enctype="multipart/form-data" method="post">
		{% csrf_token %}
		{{form|crispy}}
		  <button type="submit" class="btn btn-primary">Publish post</button>
		</form>
	
	</div>
</div>
</main>
</section>
{% endblock %}
