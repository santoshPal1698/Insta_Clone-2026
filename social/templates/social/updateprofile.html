{% extends 'base.html'%}
{% load crispy_forms_tags %}
{% block tittle %}user profile {% endblock %}
{% load static %}
{% block content %}
{% load static %}

<section class="container-fluid">
    <div class="container social-form-card card">
        <h1>Update your profile</h1>
        <p class="text-muted">Keep your information up to date.</p>
        <form method="post" action="{% url 'updateprofile' %}" enctype="multipart/form-data">
            {% csrf_token %}
            {{form|crispy}}
            <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
        <a href="{% url 'userprofile' %}" class="btn btn-dark mt-3">View profile</a>
    </div>
</section>
{% endblock %}
