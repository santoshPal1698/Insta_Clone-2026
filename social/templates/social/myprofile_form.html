{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
{% load static %}

<main class="container-fluid">
    <div class="container social-form-card card">
            <h1>Update your profile</h1>
            <p class="text-muted">Make changes to your public profile information.</p>
            <form enctype="multipart/form-data" method="post">
                {% csrf_token %}
                {{form|crispy}}
                <button class="btn btn-primary my-3" type="submit">Save changes</button>
            </form>
    </div>
</main>
{% endblock %}
