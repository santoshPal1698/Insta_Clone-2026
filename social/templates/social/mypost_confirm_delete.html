{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
{% load static %}

<main class="container-fluid">
    <div class="container social-form-card card">
        <h1>Delete this post?</h1>
        <p class="text-muted">This action cannot be undone. Confirm below to permanently delete this post.</p>
        <form enctype="multipart/form-data" method="post">
                {% csrf_token %}
                {{form | crispy}}
                <button class="btn btn-danger my-3" type="submit">Delete post</button>
        </form>
    </div>
</main>
{% endblock %}
