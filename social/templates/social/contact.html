{% extends 'base.html' %}
{% block title %} Contact us page {% endblock title %}
{% block content %}
{% load static %}


<main class="container-fluid">
    <section class="container">
        <div class="card p-3 p-md-5 mb-4">
                <h1><i class="fas fa-paper-plane mr-2 text-primary" aria-hidden="true"></i>Get in touch</h1>
                <p class="text-muted">Send a message and we will get back to you.</p>
                <form action="{% url 'contact'%}" method="POST" enctype="multipart/form-data">{% csrf_token %}
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" name="name" aria-describedby="name" placeholder="Enter Your Name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Enter your Email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" aria-describedby="phone" placeholder="Enter your Phone Number" pattern="[7-9]{1}[0-9]{9}" title="Phone number with 7-9 and remaing 9 digit with 0-9" required>
                    </div>
                    <div class="form-group">
                        <label for="desc">Description</label>
                        <textarea class="form-control" id="content" name="content" placeholder="Enter Your Messages ......" cols="10" rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send message</button>
                </form>
        </div>
        <div class="mb-3">
            <h2 class="h3"><i class="fas fa-map-marker-alt mr-2 text-primary" aria-hidden="true"></i>Find us</h2>
        </div>
        <div class="card p-2">
            <iframe title="Map showing our location" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3679.3999466866208!2d75.84001051450214!3d22.750534185091567!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39630277512c4c4b%3A0xd077cd6f46e4d7b4!2sPrince%20Nagar%20Rd%2C%20Prince%20Nagar%2C%20Indore%2C%20Madhya%20Pradesh%20452015!5e0!3m2!1sen!2sin!4v1577090623975!5m2!1sen!2sin" width="100%" height="450" loading="lazy" allowfullscreen></iframe>
        </div>
    </section>
</main>
{% endblock %}
